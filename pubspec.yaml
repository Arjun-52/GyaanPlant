name: gyaanplant
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Video playback
  video_player: ^2.8.6

  # Navigation
  go_router: ^14.2.7

  # State management
  provider: ^6.1.2

  # HTTP requests
  http: ^1.2.2
  dio: ^5.9.2

  # Local storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4

  # Payments
  razorpay_flutter: ^1.4.5

  # Firebase
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0

  # Sharing
  share_plus: ^12.0.2

  # Calendar
  table_calendar: ^3.2.0

  # URL launcher
  url_launcher: ^6.3.1

  # File picker
  file_picker: ^8.1.6

  # PDF generation
  pdf: ^3.11.1
  printing: ^5.13.3

  # SVG
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/videos/