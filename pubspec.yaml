name: gyaanplant
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.2.7

  # State management
  provider: ^6.1.2

  # HTTP requests
  http: ^1.2.2
  dio: ^5.9.2

  # Local storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4

  razorpay_flutter: ^1.4.5
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  share_plus: ^12.0.2
  table_calendar: ^3.2.0
  file_picker: ^8.1.7
  
  # PDF generation and file handling
  pdf: ^3.10.0
  printing: ^5.12.0
  path_provider: ^2.1.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
